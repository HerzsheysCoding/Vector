<script>
    lucide.createIcons();
    let isOfflineMode = false;
    let activeIncidentId = null;
    
    const map = L.map('map').setView([14.3294, 120.9367], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);
    let epicenterMarker = L.marker([14.3294, 120.9367]).addTo(map);
    const incidentLayer = L.layerGroup().addTo(map);

    function toggleOfflineMode() {
      isOfflineMode = !isOfflineMode;
      const btn = document.getElementById('offline-toggle-btn');
      btn.className = isOfflineMode ? "px-2 py-0.5 rounded text-[11px] font-bold bg-red-950 text-red-400 border border-red-700" : "px-2 py-0.5 rounded text-[11px] font-bold bg-gray-800 text-gray-400 border border-gray-700";
      btn.innerText = isOfflineMode ? "OFFLINE: ON" : "OFFLINE: OFF";
    }

    function loadScenario(type) {
      const inputs = {
        'dasmarinas': { loc: "14.3294, 120.9367", text: "Thick black smoke and a rapidly spreading brush fire near the tree line." },
        'substation': { loc: "14.5995, 120.9842", text: "High-voltage transformer explosion and arc flash at central substation." },
        'flood': { loc: "14.4081, 120.9639", text: "Rapid flash flooding reported along river basin trapping residents." }
      };
      document.getElementById('input-coords').value = inputs[type].loc;
      document.getElementById('input-report').value = inputs[type].text;
    }

    async function runTriageSimulation() {
      const btn = document.getElementById('btn-transmit');
      const rawCoords = document.getElementById('input-coords').value.split(',');
      const report = document.getElementById('input-report').value;
      
      btn.innerHTML = `<span>Executing...</span>`;
      btn.classList.add('opacity-50');

      try {
        const response = await fetch('/api/triage', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ report, lat: rawCoords[0], lng: rawCoords[1], offlineMode: isOfflineMode })
        });
        const jsonRes = await response.json();
        if (!jsonRes.success) throw new Error(jsonRes.error || "API failure");
        
        const result = jsonRes.data;
        activeIncidentId = result.id;

        document.getElementById('badge-severity').innerText = `SEV: ${result.severity_score} / 10`;
        document.getElementById('triage-title').innerText = (result.incident_classification || "UNKNOWN").replace(/_/g, ' ');
        document.getElementById('badge-confidence').innerText = `Conf: ${((result.confidence || 0) * 100).toFixed(1)}%`;
        document.getElementById('triage-summary').innerText = `Evaluated via ${result.engine || 'Vector Core'}. Mode: ${jsonRes.mode}`;
        
        const isGrounded = result.telemetry_fusion && result.telemetry_fusion.grounded === true;
        document.getElementById('tavily-status-badge').innerText = isGrounded ? "Live Search Context" : "No Grounding Data";
        document.getElementById('tavily-status-badge').className = isGrounded ? "text-amber-400 font-semibold" : "text-gray-500 font-semibold";
        document.getElementById('env-rag-text').innerText = result.telemetry_fusion?.weather || "No context available.";

        if (result.metrics && result.metrics.eval_latency_ms > 0) {
          document.getElementById('metric-speed').innerText = `${result.metrics.throughput_tok_sec || 0} tok/s`;
          document.getElementById('terminal-steps').innerHTML = `<div class="text-amber-400">Ultra Evaluator: ${result.metrics.eval_latency_ms}ms</div>`;
        } else {
          document.getElementById('metric-speed').innerText = `Edge Routing`;
          document.getElementById('terminal-steps').innerHTML = `<div class="text-red-400">Cloud bypassed. Local processing.</div>`;
        }

        const container = document.getElementById('protocols-container');
        container.innerHTML = '';
        (result.action_plan || ["No plan generated."]).forEach(step => {
          const div = document.createElement('div');
          div.className = "p-2 mb-1 rounded bg-gray-900 border border-gray-800 text-white";
          div.textContent = step;
          container.appendChild(div);
        });

        document.getElementById('terminal-json').textContent = JSON.stringify(result, null, 2);

        const dispatchBtn = document.getElementById('btn-dispatch');
        dispatchBtn.disabled = false;
        dispatchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        dispatchBtn.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5"></i><span>AUTHORIZE PLAN</span>`;
        document.getElementById('dispatch-status').innerText = "Staged for Review";

        loadIncidentHistory();
      } catch (e) {
        alert("Pipeline error: " + e.message);
      }
      btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4"></i><span>Execute Pipeline</span>`;
      btn.classList.remove('opacity-50');
      lucide.createIcons();
    }

    function toggleJsonView() {
      const steps = document.getElementById('terminal-steps');
      const json = document.getElementById('terminal-json');
      if (json.classList.contains('hidden')) { steps.classList.add('hidden'); json.classList.remove('hidden'); } 
      else { json.classList.add('hidden'); steps.classList.remove('hidden'); }
    }

    async function executeDispatch(action = 'approve') {
      if (!activeIncidentId) return;
      const btn = document.getElementById('btn-dispatch');
      try {
        const res = await fetch(`/api/incidents/${activeIncidentId}/${action}`, { method: 'POST', headers: { 'x-user-id': 'OIC-143' } });
        const data = await res.json();
        if (data.success) {
          btn.innerHTML = action === 'approve' ? `<i data-lucide="shield-check" class="w-3.5 h-3.5"></i><span>PLAN LOGGED</span>` : `<i data-lucide="x-circle" class="w-3.5 h-3.5"></i><span>REJECTED</span>`;
          btn.className = action === 'approve' ? "px-3.5 py-1.5 bg-emerald-500 text-gray-950 font-mono font-bold text-xs rounded flex gap-1.5" : "px-3.5 py-1.5 bg-red-600 text-white font-mono font-bold text-xs rounded flex gap-1.5";
          document.getElementById('dispatch-status').innerText = `Audit Saved: ${action.toUpperCase()}`;
          loadIncidentHistory();
        } else alert("Error: " + data.error);
      } catch (e) { alert("Failed to reach server."); }
    }

    async function loadIncidentHistory() {
      try {
        const res = await fetch('/api/incidents');
        const json = await res.json();
        if(json.success && json.data) {
          incidentLayer.clearLayers();
          json.data.forEach(inc => {
            let color = inc.severity >= 8 ? '#EF4444' : (inc.severity >= 6 ? '#F59E0B' : '#3B82F6');
            if(inc.status === 'REJECTED') color = '#6B7280';
            
            let circle = L.circleMarker([inc.lat, inc.lng], { radius: 6, fillColor: color, color: color, weight: 1, opacity: 1, fillOpacity: 0.6 });
            
            const popupContent = document.createElement('div');
            popupContent.className = 'text-xs';
            const title = document.createElement('strong');
            title.textContent = inc.classification;
            popupContent.appendChild(title);
            popupContent.appendChild(document.createElement('br'));
            popupContent.appendChild(document.createTextNode(`Sev: ${inc.severity} | Status: ${inc.status}`));
            
            circle.bindPopup(popupContent);
            incidentLayer.addLayer(circle);
          });
        }
      } catch (e) { console.error("History sync failed"); }
    }

    setInterval(async () => {
      const dot = document.getElementById('api-status-dot');
      const text = document.getElementById('api-status-text');
      try {
        const res = await fetch('/api/health');
        if (!res.ok) throw new Error();
        dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        text.className = "text-emerald-400 font-semibold tracking-wide";
        text.innerText = "API ONLINE";
      } catch (e) {
        dot.className = "w-2 h-2 rounded-full bg-red-500";
        text.className = "text-red-500 font-semibold tracking-wide";
        text.innerText = "API DEGRADED";
      }
    }, 10000);
    
    loadIncidentHistory();
  </script>
